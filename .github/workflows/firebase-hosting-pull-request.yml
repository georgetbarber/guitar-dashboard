name: Deploy to Firebase Hosting on PR
on: pull_request
concurrency:
  group: guitar-academy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/current
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/current/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run lint
      - name: Check adopted and newly added file formatting
        env:
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run format:check
      - run: npm run test:coverage
      - name: Preserve critical-path coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: critical-path-coverage
          path: apps/current/coverage/
          retention-days: 14
      - name: Install Chromium and system libraries
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers npx playwright install --with-deps chromium
      - name: Exercise desktop and phone journeys
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            apps/current/playwright-report/
            apps/current/test-results/
          retention-days: 14
      - run: npm run test:rules
      - name: Build Firebase-enabled application
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APP_CHECK_SITE_KEY }}
          VITE_RECORDING_SHARING: ${{ vars.VITE_RECORDING_SHARING }}
        run: |
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
            VITE_FIREBASE_APP_CHECK_SITE_KEY
          )
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub repository variable: $name"
              exit 1
            fi
          done
          npm run build
      - run: npm run check:guest-bundle
      - run: npm run check:offline-shell
      - name: Reopen a selected lesson offline from the production shell
        run: PWA_PREVIEW=1 npm run test:e2e -- tests/e2e/offline-shell.spec.ts
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEARN_THE_GUITAR }}
          entryPoint: apps/current
          projectId: learn-the-guitar
